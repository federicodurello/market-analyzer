<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>{{ ticker }} — Grafico esteso</title>
<script src="https://unpkg.com/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>
<style>
  :root { --bg:#0f1117; --panel:#171923; --border:#2a2d3a; --text:#e6e8ed; --muted:#64748b;
          --green:#22c55e; --red:#ef4444; --yellow:#fbbf24; }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; height:100%; background:var(--bg); color:var(--text);
               font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
  body { display:flex; flex-direction:column; }
  header { padding:10px 16px; border-bottom:1px solid var(--border);
           display:flex; align-items:baseline; gap:24px; flex-wrap:wrap; }
  header h1 { margin:0; font-size:18px; font-weight:600; }
  .stat { font-size:13px; color:var(--muted); }
  .stat b { color:var(--text); font-weight:600; }
  .stat.cw b { color:var(--red); }
  .stat.pw b { color:var(--green); }
  #chart { flex:1; min-height:0; }
  .badge { margin-left:auto; font-size:11px; color:var(--muted); }
  .err { padding:20px; color:var(--red); }
</style>
</head>
<body>
<header>
  <h1 id="title">{{ ticker }}</h1>
  <span class="stat">Spot: <b id="spot">—</b></span>
  <span class="stat cw">Call Wall: <b id="cw">—</b></span>
  <span class="stat pw">Put Wall: <b id="pw">—</b></span>
  <span class="badge" id="badge"></span>
</header>
<div id="chart"></div>

<script>
const TICKER = {{ ticker | tojson }};

(async () => {
  const period = "2y";
  let cd;
  try {
    cd = await fetch(`/api/chart/${encodeURIComponent(TICKER)}?period=${period}`).then(r=>r.json());
  } catch (e) {
    document.getElementById("chart").innerHTML = `<div class="err">Errore caricamento dati: ${e}</div>`;
    return;
  }
  if (!cd || !cd.ohlcv) {
    document.getElementById("chart").innerHTML = `<div class="err">Dati non disponibili per ${TICKER}.</div>`;
    return;
  }

  const container = document.getElementById("chart");
  const chart = LightweightCharts.createChart(container, {
    width: container.clientWidth,
    height: container.clientHeight,
    layout: { background:{type:"solid",color:"#0f1117"}, textColor:"#cbd5e1" },
    grid:   { vertLines:{color:"#1e2030"}, horzLines:{color:"#1e2030"} },
    crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
    rightPriceScale: { borderColor:"#2a2d3a", scaleMargins:{top:0.05,bottom:0.05} },
    timeScale: { borderColor:"#2a2d3a", timeVisible:true, rightOffset:8 },
  });

  const candle = chart.addCandlestickSeries({
    upColor:"#22c55e", downColor:"#ef4444",
    borderVisible:false, wickUpColor:"#22c55e", wickDownColor:"#ef4444",
  });
  candle.setData(cd.ohlcv);

  if (cd.bb_upper) chart.addLineSeries({color:"#ef444466",lineWidth:1,lineStyle:2}).setData(cd.bb_upper);
  if (cd.bb_lower) chart.addLineSeries({color:"#22c55e66",lineWidth:1,lineStyle:2}).setData(cd.bb_lower);
  if (cd.bb_mid)   chart.addLineSeries({color:"#fbbf2466",lineWidth:1,lineStyle:3}).setData(cd.bb_mid);
  if (cd.ema10)    chart.addLineSeries({color:"#6366f1",lineWidth:1.5}).setData(cd.ema10);
  if (cd.ema20)    chart.addLineSeries({color:"#f97316",lineWidth:1.5}).setData(cd.ema20);
  if (cd.ema50)    chart.addLineSeries({color:"#ef4444",lineWidth:1.5}).setData(cd.ema50);

  chart.timeScale().fitContent();
  window.addEventListener("resize", () => chart.applyOptions({
    width: container.clientWidth, height: container.clientHeight,
  }));

  // GEX overlay
  try {
    const g = await fetch(`/api/gex/${encodeURIComponent(TICKER)}`).then(r=>r.json());
    if (g && g.available) {
      document.getElementById("spot").textContent = g.spot?.toLocaleString("it-IT") ?? "—";
      if (g.call_wall != null) {
        document.getElementById("cw").textContent = g.call_wall.toLocaleString("it-IT");
        candle.createPriceLine({ price:g.call_wall, color:"#ef4444", lineWidth:2,
          lineStyle:0, axisLabelVisible:true, title:"Call Wall" });
      }
      if (g.put_wall != null) {
        document.getElementById("pw").textContent = g.put_wall.toLocaleString("it-IT");
        candle.createPriceLine({ price:g.put_wall, color:"#22c55e", lineWidth:2,
          lineStyle:0, axisLabelVisible:true, title:"Put Wall" });
      }
      const exp = Array.isArray(g.expiries_used) ? g.expiries_used.join(", ") : (g.expiries_used || "—");
      const upd = g.last_update ? new Date(g.last_update).toLocaleString("it-IT") : "—";
      document.getElementById("badge").textContent =
        `GEX · scadenze ${exp} · ${g.strikes_used} strike · ${g.note || ""} · aggiornato ${upd}`;
    }
  } catch {}
})();
</script>
</body>
</html>
