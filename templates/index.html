<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Market Analyzer</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://unpkg.com/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>
<style>
:root {
  --bg: #0f1117; --surface: #1a1d27; --surface2: #222536;
  --border: #2a2d3a; --text: #e2e8f0; --muted: #64748b;
  --accent: #6366f1; --green: #22c55e; --yellow: #fbbf24; --red: #ef4444;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: system-ui,sans-serif; font-size: 13px; }

/* ALERT BANNER */
#greenAlert {
  position: fixed; top: -70px; left: 50%; transform: translateX(-50%);
  background: #14532d; border: 1px solid var(--green); color: var(--green);
  padding: 12px 24px; border-radius: 10px; font-weight: 700; font-size: 14px;
  z-index: 200; transition: top .4s ease; white-space: nowrap;
  box-shadow: 0 4px 24px #22c55e44;
}
#greenAlert.visible { top: 16px; }
@keyframes pulse-green { 0%,100%{box-shadow:0 4px 24px #22c55e44} 50%{box-shadow:0 4px 40px #22c55eaa} }
#greenAlert.visible { animation: pulse-green 1.5s ease infinite; }

/* HEADER */
header {
  padding: 14px 20px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
}
header h1 { font-size: 16px; font-weight: 700; flex: 1; }
.controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
select, button {
  background: var(--surface); border: 1px solid var(--border);
  color: var(--text); padding: 6px 12px; border-radius: 7px; font-size: 12px; cursor: pointer;
}
button.primary { background: var(--accent); border-color: var(--accent); color:#fff; font-weight:600; }
button:hover { opacity:.85; }
button:disabled { opacity:.5; cursor:not-allowed; }

.status-row {
  padding: 6px 20px; border-bottom: 1px solid var(--border);
  display: flex; gap: 16px; align-items: center; font-size: 11px; color: var(--muted);
}
.dot-live { width:7px; height:7px; border-radius:50%; background:var(--green); display:inline-block;
  animation: blink 2s ease infinite; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }

/* MAIN TABLE */
main { padding: 16px 20px; }
.table-wrap { overflow-x: auto; border-radius: 10px; border: 1px solid var(--border); }
table { width: 100%; border-collapse: collapse; }
thead tr { background: var(--surface); }
th {
  padding: 10px 12px; text-align: left; font-size: 10px; font-weight: 600;
  color: var(--muted); text-transform: uppercase; letter-spacing:.5px;
  white-space: nowrap; cursor: pointer; user-select: none;
}
th:hover { color: var(--text); }
th.sorted { color: var(--accent); }
td { padding: 10px 12px; border-top: 1px solid var(--border); white-space: nowrap; }
tr:hover td { background: rgba(255,255,255,.03); cursor: pointer; }

/* SEMAFORO */
.semaforo-cell { text-align: center; }
.semaforo-circle {
  display: inline-flex; flex-direction: column; align-items: center;
  justify-content: center; width: 52px; height: 52px; border-radius: 50%;
  font-weight: 900; font-size: 18px; line-height: 1;
  box-shadow: 0 0 14px var(--sc, #0000);
}
.semaforo-label { font-size: 9px; margin-top: 3px; font-weight: 700; letter-spacing: .5px; }
.semaforo-sub { font-size: 9px; color: var(--muted); }

/* SCORE BAR */
.score-wrap { display:flex; align-items:center; gap:8px; }
.score-bar-bg { width:70px; height:5px; background:var(--border); border-radius:3px; overflow:hidden; }
.score-bar { height:100%; border-radius:3px; }

.badge {
  display:inline-block; padding:2px 8px; border-radius:20px;
  font-size:10px; font-weight:700; letter-spacing:.3px;
}
.cat-chip {
  display:inline-block; padding:2px 7px; border-radius:4px;
  font-size:10px; background:rgba(99,102,241,.15); color:#a5b4fc;
}
.ema-badge {
  font-size:10px; font-weight:700;
}

/* RISCHIO BASSO BUTTON + TOOLTIP */
.rb-wrap { position:relative; display:inline-block; }
.rb-btn {
  display:inline-block; padding:5px 11px; border-radius:20px;
  font-size:11px; font-weight:700; letter-spacing:.3px; cursor:default;
  border:none; white-space:nowrap;
}
.rb-btn.basso  { background:#1d4ed822; color:#60a5fa; border:1px solid #3b82f6; }
.rb-btn.alta   { background:#1d4ed8;   color:#fff;    border:1px solid #3b82f1;
                 box-shadow:0 0 12px #3b82f688; animation:pulse-blue 2s ease infinite; }
@keyframes pulse-blue { 0%,100%{box-shadow:0 0 10px #3b82f655} 50%{box-shadow:0 0 22px #3b82f6bb} }

.rb-tooltip {
  display:none; position:absolute; bottom:calc(100% + 8px); left:50%;
  transform:translateX(-50%); background:#1a1d27; border:1px solid #3b82f6;
  border-radius:10px; padding:12px 14px; width:230px; z-index:200;
  font-size:11px; color:var(--text); pointer-events:none;
  box-shadow:0 8px 24px #0008;
}
.rb-tooltip::after {
  content:""; position:absolute; top:100%; left:50%; transform:translateX(-50%);
  border:6px solid transparent; border-top-color:#3b82f6;
}
.rb-wrap:hover .rb-tooltip { display:block; }
.rb-tooltip .rb-row { display:flex; align-items:center; gap:7px; margin:4px 0; }
.rb-tooltip .rb-row .dot { width:8px;height:8px;border-radius:50%;flex-shrink:0; }
.rb-counter { font-weight:700; font-size:12px; margin-bottom:8px;
              padding-bottom:7px; border-bottom:1px solid var(--border); }

/* LOADING */
.loading { text-align:center; padding:60px; color:var(--muted); }
.spinner {
  display:inline-block; width:28px; height:28px;
  border:3px solid var(--border); border-top-color:var(--accent);
  border-radius:50%; animation:spin .7s linear infinite; margin-bottom:10px;
}
@keyframes spin { to{transform:rotate(360deg)} }

.disclaimer {
  margin-top:20px; padding:10px 14px; border-radius:8px;
  background:rgba(251,191,36,.07); border:1px solid rgba(251,191,36,.2);
  color:var(--muted); font-size:11px; line-height:1.6;
}

/* MODAL */
.modal-overlay {
  display:none; position:fixed; inset:0;
  background:rgba(0,0,0,.75); z-index:100;
  align-items:center; justify-content:center;
}
.modal-overlay.open { display:flex; }
.modal {
  background:var(--surface); border:1px solid var(--border);
  border-radius:14px; padding:20px; width:95vw; max-width:1100px;
  max-height:94vh; overflow-y:auto; position:relative;
}
.modal-header { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:16px; }
.modal-header h2 { font-size:15px; }
.modal-close { background:none; border:none; color:var(--muted); font-size:20px; cursor:pointer; }

/* INDICATOR CARDS */
.ind-grid {
  display:grid; grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); gap:8px; margin-bottom:16px;
}
.ind-card {
  background:var(--bg); border-radius:8px; padding:10px 12px; border:1px solid var(--border);
}
.ind-card .lbl { font-size:10px; color:var(--muted); text-transform:uppercase; margin-bottom:3px; }
.ind-card .val { font-size:18px; font-weight:700; }
.ind-card .hint { font-size:10px; color:var(--muted); margin-top:2px; }

/* CHARTS GRID */
.chart-section { margin-bottom:12px; }
.chart-section h3 { font-size:11px; color:var(--muted); text-transform:uppercase; margin-bottom:8px; }
.chart-box { background:var(--bg); border-radius:8px; padding:12px; border:1px solid var(--border); }
.charts-row { display:grid; gap:10px; margin-top:10px; }
.charts-row-4 { grid-template-columns:1fr 1fr; }
.charts-row-1 { grid-template-columns:1fr; }
canvas { max-height:160px; }
#lwChartContainer { height:320px; border-radius:8px; overflow:hidden; }

/* BACKTEST */
.bt-stats { display:grid; grid-template-columns:repeat(auto-fill,minmax(110px,1fr)); gap:8px; margin-bottom:12px; }
.bt-trade-wrap { max-height:180px; overflow-y:auto; border-radius:6px; border:1px solid var(--border); margin-top:10px; }
.bt-trade-table { width:100%; border-collapse:collapse; font-size:11px; }
.bt-trade-table th { padding:5px 10px; background:var(--surface); color:var(--muted); font-size:10px;
                     text-transform:uppercase; letter-spacing:.4px; text-align:left; position:sticky; top:0; }
.bt-trade-table td { padding:5px 10px; border-top:1px solid var(--border); }
.bt-section { margin-top:14px; padding:14px 16px; background:var(--bg);
              border-radius:10px; border:1px solid var(--border); }
.bt-section h3 { font-size:11px; color:var(--muted); text-transform:uppercase;
                 letter-spacing:.5px; margin-bottom:12px; }
.affid-chip { display:inline-block; padding:2px 8px; border-radius:20px;
              font-size:10px; font-weight:700; }

/* SHORT button */
.short-wrap { position:relative; display:inline-block; }
.short-btn {
  display:inline-block; padding:5px 11px; border-radius:20px;
  font-size:11px; font-weight:700; letter-spacing:.3px; cursor:default;
  background:#450a0a; color:#fca5a5; border:1px solid #ef4444;
  box-shadow:0 0 12px #ef444488; animation:pulse-red 2s ease infinite;
  white-space:nowrap;
}
@keyframes pulse-red { 0%,100%{box-shadow:0 0 10px #ef444455} 50%{box-shadow:0 0 24px #ef4444cc} }
.short-tooltip {
  display:none; position:absolute; bottom:calc(100% + 8px); left:50%;
  transform:translateX(-50%); background:#1a1d27; border:1px solid #ef4444;
  border-radius:10px; padding:12px 14px; width:230px; z-index:200;
  font-size:11px; color:var(--text); pointer-events:none;
  box-shadow:0 8px 24px #0008;
}
.short-tooltip::after {
  content:""; position:absolute; top:100%; left:50%; transform:translateX(-50%);
  border:6px solid transparent; border-top-color:#ef4444;
}
.short-wrap:hover .short-tooltip { display:block; }
.short-counter { font-weight:700; font-size:12px; margin-bottom:8px;
                 padding-bottom:7px; border-bottom:1px solid var(--border); color:#f87171; }
</style>
</head>
<body>

<div id="greenAlert"></div>

<header>
  <h1>Market Analyzer</h1>
  <div class="controls">
    <select id="catFilter"><option value="all">Tutte le categorie</option></select>
    <select id="periodSelect">
      <option value="6mo">6 mesi</option>
      <option value="1y">1 anno</option>
      <option value="2y" selected>2 anni</option>
    </select>
    <button class="primary" id="refreshBtn">Aggiorna</button>
  </div>
</header>

<div class="status-row">
  <span><span class="dot-live"></span> <span id="statusText">Avvio analisi...</span></span>
  <span id="lastUpdate"></span>
  <span id="nextUpdateEl" style="color:var(--accent)"></span>
  <span id="countdown" style="margin-left:auto"></span>
</div>

<main>
  <div id="tableContainer">
    <div class="loading">
      <div class="spinner"></div>
      <div>Scaricamento dati di mercato in corso…<br><small style="color:var(--muted)">Prima apertura: ~20 secondi</small></div>
    </div>
  </div>
  <div class="disclaimer">
    ⚠️ Solo a scopo informativo e didattico. Non costituisce consulenza finanziaria. I segnali tecnici non garantiscono rendimenti futuri.
  </div>
</main>

<!-- MODAL CHARTS -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-header">
      <div>
        <h2 id="modalTitle">—</h2>
        <div style="font-size:11px;color:var(--muted);margin-top:3px" id="modalSubtitle"></div>
      </div>
      <button class="modal-close" id="modalClose">✕</button>
    </div>
    <div id="modalBody"></div>
  </div>
</div>

<script>
// ── STATE ──────────────────────────────────────────────────────────────────
let allData       = [];
let sortKey       = "score";
let sortDir       = -1;
let cjInstances   = {};
let lwChart       = null;
let prevSemafori  = {};
let nextRefreshAt = null;
let countdownTmr  = null;
let refreshTmr    = null;
let btData        = {};
let btReady       = false;
let _btFetching   = false;

const periodSelect    = document.getElementById("periodSelect");
const catFilter       = document.getElementById("catFilter");
const refreshBtn      = document.getElementById("refreshBtn");
const statusText      = document.getElementById("statusText");
const lastUpdateEl    = document.getElementById("lastUpdate");
const nextUpdateEl    = document.getElementById("nextUpdateEl");
const countdownEl     = document.getElementById("countdown");
const tableContainer  = document.getElementById("tableContainer");

// ── CATEGORIES ─────────────────────────────────────────────────────────────
fetch("/api/categories").then(r=>r.json()).then(cats=>{
  cats.forEach(c=>{
    const o = document.createElement("option");
    o.value = c; o.textContent = c==="all"?"Tutte le categorie":c;
    catFilter.appendChild(o);
  });
});

// ── EVENTS ─────────────────────────────────────────────────────────────────
refreshBtn.addEventListener("click", ()=>loadData(false));
catFilter.addEventListener("change", renderTable);
document.getElementById("modalClose").addEventListener("click", closeModal);
document.getElementById("modalOverlay").addEventListener("click", e=>{
  if(e.target===document.getElementById("modalOverlay")) closeModal();
});

// ── STARTUP: poll until backend cache is ready ──────────────────────────────
window.addEventListener("DOMContentLoaded", pollReady);

function pollReady() {
  fetch("/api/status").then(r=>r.json()).then(s=>{
    if(s.next_update) nextRefreshAt = new Date(s.next_update);
    if(s.ready){
      loadData(false);
    } else {
      statusText.textContent = "Analisi in corso...";
      setTimeout(pollReady, 3000);
    }
  }).catch(()=>setTimeout(pollReady, 5000));
}

// ── LOAD DATA ───────────────────────────────────────────────────────────────
async function loadData(silent=false) {
  const period = periodSelect.value;
  refreshBtn.disabled = true;
  if(!silent){
    statusText.textContent = "Aggiornamento...";
    tableContainer.innerHTML = `<div class="loading"><div class="spinner"></div><div>Analisi in corso...</div></div>`;
  }
  try {
    const [res, sRes] = await Promise.all([
      fetch(`/api/analyze?period=${period}`),
      fetch("/api/status"),
    ]);
    const data   = await res.json();
    const status = await sRes.json();

    if(status.next_update) nextRefreshAt = new Date(status.next_update);
    else nextRefreshAt = calcNextRefresh();

    checkGreenTransitions(data);
    allData = data;
    prevSemafori = {};
    allData.forEach(d=>{ prevSemafori[d.ticker]=d.semaforo.level; });

    const now = new Date();
    statusText.textContent   = `${data.length} asset analizzati — timeframe giornaliero`;
    lastUpdateEl.textContent = `Aggiornato: ${now.toLocaleTimeString("it-IT")} · dati ~15 min ritardati`;
    nextUpdateEl.textContent = `Prossimo aggiornamento: ${nextRefreshAt.toLocaleTimeString("it-IT")}`;
    renderTable();
    scheduleNextRefresh();
    fetchBtData();
  } catch(e) {
    statusText.textContent = "Errore caricamento dati.";
  } finally {
    refreshBtn.disabled = false;
  }
}

// ── AUTO-REFRESH (ogni ~90 secondi) ──────────────────────────────────────────
function calcNextRefresh() {
  return new Date(Date.now() + 90000);
}

function scheduleNextRefresh() {
  if(refreshTmr)  clearInterval(refreshTmr);
  if(countdownTmr) clearInterval(countdownTmr);

  if(!nextRefreshAt) nextRefreshAt = calcNextRefresh();

  // Controlla ogni 5s se e' ora del refresh automatico
  refreshTmr = setInterval(()=>{
    if(Date.now() >= nextRefreshAt.getTime()){
      clearInterval(refreshTmr); refreshTmr = null;
      nextRefreshAt = calcNextRefresh();
      loadData(true);
    }
  }, 5000);

  countdownTmr = setInterval(()=>{
    const rem = Math.max(0, Math.round((nextRefreshAt.getTime()-Date.now())/1000));
    const d = Math.floor(rem/86400);
    const h = Math.floor((rem%86400)/3600);
    const m = Math.floor((rem%3600)/60);
    const s = rem%60;
    if(d>0)      countdownEl.textContent = `Aggiorn. tra: ${d}g ${h}h`;
    else if(h>0) countdownEl.textContent = `Aggiorn. tra: ${h}h ${m}m`;
    else         countdownEl.textContent = `Aggiorn. tra: ${m}:${s.toString().padStart(2,"0")}`;
  }, 1000);
}

// ── BACKTEST DATA ───────────────────────────────────────────────────────────
function fetchBtData() {
  if(btReady || _btFetching) return;
  _btFetching = true;
  _pollBt();
}

function _pollBt() {
  fetch("/api/backtest").then(r=>r.json()).then(j=>{
    if(j.ready){
      btReady     = true;
      btData      = j.data || {};
      _btFetching = false;
      renderTable();
    } else {
      setTimeout(_pollBt, 5000);
    }
  }).catch(()=>{ setTimeout(_pollBt, 10000); });
}

// ── GREEN TRANSITION ALERT ──────────────────────────────────────────────────
function checkGreenTransitions(newData) {
  if(!Object.keys(prevSemafori).length) return;
  const alerts = newData
    .filter(a=>prevSemafori[a.ticker] && prevSemafori[a.ticker]!=="green" && a.semaforo.level==="green")
    .map(a=>a.name);
  if(alerts.length){
    const el = document.getElementById("greenAlert");
    el.textContent = `🟢 Nuovo segnale VERDE: ${alerts.join(", ")}`;
    el.classList.add("visible");
    setTimeout(()=>el.classList.remove("visible"), 10000);
  }
}

// ── TABLE ───────────────────────────────────────────────────────────────────
function relColor(v) {
  if(v == null || v === undefined) return "var(--muted)";
  return v >= 60 ? "var(--green)" : v >= 50 ? "var(--yellow)" : "var(--red)";
}
function relCell(ticker) {
  if(!btReady) return `<span style="color:var(--muted);font-size:10px">…</span>`;
  const bt = btData[ticker];
  if(!bt || bt.signals === 0) return `<span style="color:var(--muted)">--</span>`;
  const c = relColor(bt.win_rate);
  return `<span class="affid-chip" style="background:${c}22;color:${c}">${bt.win_rate}%</span>`;
}

function renderTable() {
  const cat = catFilter.value;
  let data  = cat==="all" ? allData : allData.filter(d=>d.category===cat);
  data = [...data].sort((a,b)=>{
    // DAX sempre in cima (priorita')
    const ad = a.category==="DAX"?0:1, bd = b.category==="DAX"?0:1;
    if(ad!==bd) return ad-bd;
    if(sortKey === "reliability") {
      const av = btData[a.ticker]?.win_rate ?? -1;
      const bv = btData[b.ticker]?.win_rate ?? -1;
      return sortDir * (bv - av);
    }
    if(sortKey === "short_count") {
      const av = a.short_enabled ? (a.short?.count ?? -1) : -99;
      const bv = b.short_enabled ? (b.short?.count ?? -1) : -99;
      return sortDir * (bv - av);
    }
    let va=a[sortKey],vb=b[sortKey];
    if(typeof va==="string") return sortDir*va.localeCompare(vb);
    return sortDir*(vb-va);
  });
  if(!data.length){
    tableContainer.innerHTML=`<div class="loading">Nessun dato disponibile.</div>`; return;
  }

  const cols = [
    {key:"semaforo_count", label:"Segnale"},
    {key:"rb_count",       label:"Confidenza"},
    {key:"short_count",    label:"SHORT"},
    {key:"name",           label:"Asset"},
    {key:"score",          label:"Score"},
    {key:"price",          label:"Prezzo"},
    {key:"rsi",            label:"RSI"},
    {key:"cci",            label:"CCI"},
    {key:"stoch_k",        label:"StochK"},
    {key:"bb_position",    label:"BB%"},
    {key:"ema_bullish",    label:"EMA"},
    {key:"macd_bullish",   label:"MACD"},
    {key:"atr_pct",        label:"ATR%"},
    {key:"vol_ratio",      label:"Vol×"},
    {key:"pct_from_low",   label:"% Min"},
    {key:"reliability",    label:"Affid. %"},
  ];

  let html=`<div class="table-wrap"><table><thead><tr>`;
  cols.forEach(c=>{
    const cls=sortKey===c.key?"sorted":"";
    html+=`<th class="${cls}" data-key="${c.key}">${c.label}${sortKey===c.key?(sortDir>0?" ↑":" ↓"):""}</th>`;
  });
  html+=`</tr></thead><tbody>`;

  data.forEach(row=>{
    const sf   = row.semaforo;
    const sc   = sf.color;
    const bg   = sc+"22";

    // EMA status
    let emaHtml = row.golden_cross
      ? `<span class="ema-badge" style="color:var(--green)">☀ Gold</span>`
      : row.ema_bullish
        ? `<span class="ema-badge" style="color:#86efac">↑ Bull</span>`
        : `<span class="ema-badge" style="color:var(--muted)">↓ Bear</span>`;

    const rb    = row.rischio_basso;
    const rbCell = rb.show
      ? `<div class="rb-wrap">
           <span class="rb-btn ${rb.level}">${rb.label}</span>
           <div class="rb-tooltip">
             <div class="rb-counter">${rb.count}/7 criteri soddisfatti</div>
             ${Object.entries(rb.criteria).map(([k,v])=>`
               <div class="rb-row">
                 <span class="dot" style="background:${v?'var(--green)':'var(--red)'}"></span>
                 <span style="color:${v?'var(--text)':'var(--muted)'}">${k}</span>
               </div>`).join("")}
           </div>
         </div>`
      : `<span style="color:var(--border);font-size:10px">${rb.count}/7</span>`;

    const sh = row.short;
    const shCell = !row.short_enabled
      ? `<span style="color:var(--border)">—</span>`
      : (sh && sh.show)
        ? `<div class="short-wrap">
             <span class="short-btn">▼ SHORT</span>
             <div class="short-tooltip">
               <div class="short-counter">${sh.count}/7 criteri short</div>
               ${Object.entries(sh.criteria).map(([k,v])=>`
                 <div class="rb-row">
                   <span class="dot" style="background:${v?'var(--red)':'var(--muted)'}"></span>
                   <span style="color:${v?'var(--text)':'var(--muted)'}">${k}</span>
                 </div>`).join("")}
             </div>
           </div>`
        : `<span style="color:var(--border);font-size:10px">${sh ? sh.count : 0}/7</span>`;

    html+=`<tr data-ticker="${row.ticker}" data-name="${row.name}">
      <td class="semaforo-cell">
        <div class="semaforo-circle" style="background:${bg};color:${sc};--sc:${sc}44">
          ${sf.count}
        </div>
        <div class="semaforo-label" style="color:${sc}">${sf.label}</div>
        <div class="semaforo-sub">/7</div>
      </td>
      <td style="text-align:center">${rbCell}</td>
      <td style="text-align:center">${shCell}</td>
      <td>
        <span style="font-weight:600">${row.name}</span><br>
        <span style="color:var(--muted);font-size:10px">${row.ticker} · <span class="cat-chip">${row.category}</span></span>
      </td>
      <td>
        <div class="score-wrap">
          <span style="font-weight:700;min-width:24px">${row.score}</span>
          <div class="score-bar-bg"><div class="score-bar" style="width:${row.score}%;background:${row.signal_color}"></div></div>
        </div>
      </td>
      <td style="font-weight:600">${row.price}</td>
      <td style="color:${rsiColor(row.rsi)};font-weight:600">${row.rsi}</td>
      <td style="color:${cciColor(row.cci)};font-weight:600">${row.cci}</td>
      <td style="color:${stochColor(row.stoch_k)};font-weight:600">${row.stoch_k}</td>
      <td style="color:${bbColor(row.bb_position)};font-weight:600">${row.bb_position}%</td>
      <td>${emaHtml}</td>
      <td style="color:${row.macd_bullish?"var(--green)":"var(--red)"};font-weight:700">${row.macd_bullish?"↑":"↓"}</td>
      <td style="color:${row.atr_pct>3?"var(--yellow)":"var(--muted)"}">${row.atr_pct}%</td>
      <td style="color:${row.vol_ratio>1.5?"var(--yellow)":"var(--muted)"}">${row.vol_ratio}×</td>
      <td style="color:var(--green)">${row.pct_from_low}%</td>
      <td style="text-align:center">${relCell(row.ticker)}</td>
    </tr>`;
  });

  html+=`</tbody></table></div>`;
  tableContainer.innerHTML=html;

  document.querySelectorAll("th[data-key]").forEach(th=>{
    th.addEventListener("click",()=>{
      const key=th.dataset.key;
      if(sortKey===key) sortDir*=-1; else{sortKey=key;sortDir=-1;}
      renderTable();
    });
  });

  document.querySelectorAll("tbody tr").forEach(tr=>{
    tr.addEventListener("click",()=>{
      const ticker=tr.dataset.ticker, name=tr.dataset.name;
      const row=data.find(d=>d.ticker===ticker);
      openModal(ticker,name,row);
    });
  });
}

// ── COLOR HELPERS ───────────────────────────────────────────────────────────
function rsiColor(v){  return v<30?"var(--green)":v>70?"var(--red)":"var(--text)"; }
function cciColor(v){  return v<-200?"var(--green)":v<-100?"var(--yellow)":v>100?"var(--red)":"var(--text)"; }
function stochColor(v){ return v<20?"var(--green)":v>80?"var(--red)":"var(--text)"; }
function bbColor(v){   return v<20?"var(--green)":v>80?"var(--red)":"var(--text)"; }

// ── MODAL ────────────────────────────────────────────────────────────────────
async function openModal(ticker,name,rowData){
  document.getElementById("modalTitle").textContent = name;
  document.getElementById("modalSubtitle").textContent = ticker;
  document.getElementById("modalOverlay").classList.add("open");
  document.getElementById("modalBody").innerHTML=
    `<div class="loading"><div class="spinner"></div><div>Caricamento grafici…</div></div>`;

  // Destroy old charts
  Object.values(cjInstances).forEach(c=>c.destroy());
  cjInstances={};
  if(lwChart){ lwChart.remove(); lwChart=null; }

  const period=periodSelect.value;
  const d=await fetch(`/api/chart/${ticker}?period=${period}`).then(r=>r.json());
  if(!d.ohlcv){
    document.getElementById("modalBody").innerHTML=`<div style="color:var(--muted)">Dati non disponibili.</div>`;
    return;
  }

  const sf=rowData.semaforo;
  const detailsHtml = Object.entries(sf.details)
    .map(([k,v])=>`<span style="color:${v?"var(--green)":"var(--muted)"};margin-right:10px">${v?"✓":"✗"} ${k}</span>`)
    .join("");

  document.getElementById("modalBody").innerHTML=`
    <!-- SEMAFORO + DETAILS -->
    <div style="display:flex;align-items:center;gap:20px;margin-bottom:16px;padding:12px 16px;background:var(--bg);border-radius:10px;border:1px solid var(--border)">
      <div class="semaforo-circle" style="background:${sf.color}22;color:${sf.color};width:64px;height:64px;font-size:24px">
        ${sf.count}
      </div>
      <div>
        <div style="font-weight:700;font-size:15px;color:${sf.color}">${sf.label} — ${sf.count}/7 segnali</div>
        <div style="margin-top:6px;font-size:11px">${detailsHtml}</div>
      </div>
    </div>

    <!-- INDICATOR CARDS -->
    <div class="ind-grid">
      ${indCard("RSI (14)", rowData.rsi, rsiColor(rowData.rsi), rowData.rsi<30?"Ipervenduto ✓":rowData.rsi>70?"Ipercomprato ✗":"Neutrale")}
      ${indCard("CCI (14)", rowData.cci, cciColor(rowData.cci), rowData.cci<-200?"Ipervenduto ✓":rowData.cci<-100?"Zona grigia":rowData.cci>100?"Ipercomprato ✗":"Neutrale")}
      ${indCard("StochRSI K", rowData.stoch_k, stochColor(rowData.stoch_k), rowData.stoch_k<20?"Ipervenduto ✓":rowData.stoch_k>80?"Ipercomprato ✗":"Neutrale")}
      ${indCard("BB%", rowData.bb_position+"%", bbColor(rowData.bb_position), rowData.bb_position<20?"Vicino al fondo ✓":rowData.bb_position>80?"Vicino al tetto ✗":"Zona centrale")}
      ${indCard("MACD", rowData.macd_bullish?"Bullish ↑":"Bearish ↓", rowData.macd_bullish?"var(--green)":"var(--red)", `Signal: ${rowData.macd_signal}`)}
      ${indCard("EMA trend", rowData.golden_cross?"Golden Cross ☀":rowData.ema_bullish?"Bullish ↑":"Bearish ↓", rowData.golden_cross?"var(--yellow)":rowData.ema_bullish?"var(--green)":"var(--red)", `10:${rowData.ema10} / 20:${rowData.ema20} / 50:${rowData.ema50}`)}
      ${indCard("ATR%", rowData.atr_pct+"%", rowData.atr_pct>3?"var(--yellow)":"var(--muted)", "Volatilità")}
      ${indCard("Volume", rowData.vol_ratio+"×", rowData.vol_ratio>1.5?"var(--yellow)":"var(--muted)", "vs media 10 giorni")}
      ${indCard("Score", rowData.score+"/100", rowData.signal_color, rowData.signal)}
    </div>

    <!-- CANDLESTICK -->
    <div class="chart-box chart-section" style="margin-bottom:10px">
      <h3>Prezzo — Candlestick + BB + EMA</h3>
      <div id="lwChartContainer"></div>
    </div>

    <!-- LOWER CHARTS 2×2 -->
    <div class="charts-row charts-row-4">
      <div class="chart-box chart-section"><h3>RSI (14)</h3><canvas id="cRsi"></canvas></div>
      <div class="chart-box chart-section"><h3>MACD</h3><canvas id="cMacd"></canvas></div>
      <div class="chart-box chart-section"><h3>Volume</h3><canvas id="cVol"></canvas></div>
      <div class="chart-box chart-section"><h3>Stochastic RSI</h3><canvas id="cStoch"></canvas></div>
    </div>

    <!-- BACKTEST LONG -->
    <div class="bt-section">
      <h3>Backtest storico — 3 anni · daily · holding 5 giorni — Alta Confidenza (5+/7)</h3>
      <div id="btModalBody">${buildBtHtml(ticker, btData[ticker])}</div>
    </div>
    ${rowData.short_enabled ? `
    <!-- BACKTEST SHORT -->
    <div class="bt-section" style="border-color:#ef444433;margin-top:10px">
      <h3 style="color:#f87171">Backtest SHORT — 3 anni · daily · holding 5 giorni (5+/7)</h3>
      <div id="btShortBody">${buildBtHtml(ticker, btData[ticker]?.short, true)}</div>
    </div>` : ''}`;

  buildLWChart(d);
  buildCJCharts(d);
  const _bt = btData[ticker];
  if(btReady && _bt && _bt.signals > 0) buildEquityCurve(_bt.equity_curve, "cEquity");
  if(rowData.short_enabled && btReady && _bt?.short && _bt.short.signals > 0)
    buildEquityCurve(_bt.short.equity_curve, "cEquityShort");
}

function indCard(label, value, color, hint) {
  return `<div class="ind-card">
    <div class="lbl">${label}</div>
    <div class="val" style="color:${color}">${value}</div>
    <div class="hint">${hint}</div>
  </div>`;
}

// ── LIGHTWEIGHT CHARTS (candlestick) ─────────────────────────────────────────
function buildLWChart(d) {
  const container = document.getElementById("lwChartContainer");
  const opts = {
    width:  container.clientWidth,
    height: 320,
    layout: { background:{type:"solid",color:"#0f1117"}, textColor:"#64748b" },
    grid:   { vertLines:{color:"#1e2030"}, horzLines:{color:"#1e2030"} },
    crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
    rightPriceScale: { borderColor:"#2a2d3a" },
    timeScale: { borderColor:"#2a2d3a", timeVisible:true },
  };
  lwChart = LightweightCharts.createChart(container, opts);

  const candle = lwChart.addCandlestickSeries({
    upColor:"#22c55e", downColor:"#ef4444",
    borderVisible:false, wickUpColor:"#22c55e", wickDownColor:"#ef4444",
  });
  candle.setData(d.ohlcv);

  const bbU = lwChart.addLineSeries({color:"#ef444466",lineWidth:1,lineStyle:2});
  bbU.setData(d.bb_upper);
  const bbL = lwChart.addLineSeries({color:"#22c55e66",lineWidth:1,lineStyle:2});
  bbL.setData(d.bb_lower);
  const bbM = lwChart.addLineSeries({color:"#fbbf2466",lineWidth:1,lineStyle:3});
  bbM.setData(d.bb_mid);
  const e10 = lwChart.addLineSeries({color:"#6366f1",lineWidth:1.5});
  e10.setData(d.ema10);
  const e20 = lwChart.addLineSeries({color:"#f97316",lineWidth:1.5});
  e20.setData(d.ema20);
  const e50 = lwChart.addLineSeries({color:"#ef4444",lineWidth:1.5});
  e50.setData(d.ema50);

  lwChart.timeScale().fitContent();
  window.addEventListener("resize", ()=>{
    if(lwChart) lwChart.applyOptions({width:container.clientWidth});
  });
}

// ── CHART.JS (RSI, MACD, Volume, Stoch) ─────────────────────────────────────
function buildCJCharts(d) {
  const gc = "#1e2030", tc = "#64748b";
  const baseOpts = {
    responsive:true, maintainAspectRatio:true,
    plugins:{legend:{labels:{color:tc,boxWidth:10,font:{size:10}}}},
    scales:{
      x:{ticks:{color:tc,maxTicksLimit:6,font:{size:9}},grid:{color:gc}},
      y:{ticks:{color:tc,font:{size:9}},grid:{color:gc}}
    }
  };

  // RSI
  const rsiDates = d.rsi.map(p=>p.time);
  const rsiVals  = d.rsi.map(p=>p.value);
  cjInstances.rsi = new Chart(document.getElementById("cRsi"),{
    type:"line",
    data:{labels:rsiDates,datasets:[
      {label:"RSI",data:rsiVals,borderColor:"#a78bfa",borderWidth:1.5,pointRadius:0,tension:.1},
      {label:"70",data:rsiDates.map(()=>70),borderColor:"#ef444455",borderWidth:1,borderDash:[4,2],pointRadius:0},
      {label:"30",data:rsiDates.map(()=>30),borderColor:"#22c55e55",borderWidth:1,borderDash:[4,2],pointRadius:0},
    ]},
    options:{...baseOpts,scales:{...baseOpts.scales,y:{...baseOpts.scales.y,min:0,max:100}}}
  });

  // MACD
  const macdDates = d.macd.map(p=>p.time);
  cjInstances.macd = new Chart(document.getElementById("cMacd"),{
    type:"bar",
    data:{labels:d.macd_hist.map(p=>p.time),datasets:[
      {type:"bar",  label:"Hist",  data:d.macd_hist.map(p=>p.value),
       backgroundColor:d.macd_hist.map(p=>p.color),borderWidth:0},
      {type:"line", label:"MACD",  data:d.macd.map(p=>({x:p.time,y:p.value})),
       borderColor:"#6366f1",borderWidth:1.5,pointRadius:0,tension:.1},
      {type:"line", label:"Signal",data:d.macd_signal.map(p=>({x:p.time,y:p.value})),
       borderColor:"#f97316",borderWidth:1,borderDash:[3,2],pointRadius:0,tension:.1},
    ]},
    options:baseOpts
  });

  // Volume
  cjInstances.vol = new Chart(document.getElementById("cVol"),{
    type:"bar",
    data:{labels:d.volume.map(p=>p.time),datasets:[
      {type:"bar",  label:"Volume", data:d.volume.map(p=>p.value),
       backgroundColor:"#6366f166",borderWidth:0},
      {type:"line", label:"MA10",   data:d.vol_ma10.map(p=>({x:p.time,y:p.value})),
       borderColor:"#fbbf24",borderWidth:1.5,pointRadius:0,tension:.1},
    ]},
    options:{...baseOpts,scales:{...baseOpts.scales,y:{...baseOpts.scales.y,
      ticks:{...baseOpts.scales.y.ticks,callback:v=>v>=1e9?v/1e9+"B":v>=1e6?v/1e6+"M":v>=1e3?v/1e3+"K":v}}}}
  });

  // Stochastic RSI
  const skDates = d.stoch_k.map(p=>p.time);
  cjInstances.stoch = new Chart(document.getElementById("cStoch"),{
    type:"line",
    data:{labels:skDates,datasets:[
      {label:"K",    data:d.stoch_k.map(p=>p.value),borderColor:"#2dd4bf",borderWidth:1.5,pointRadius:0,tension:.1},
      {label:"D",    data:d.stoch_d.map(p=>p.value),borderColor:"#f97316",borderWidth:1,borderDash:[3,2],pointRadius:0,tension:.1},
      {label:"80",   data:skDates.map(()=>80),borderColor:"#ef444455",borderWidth:1,borderDash:[4,2],pointRadius:0},
      {label:"20",   data:skDates.map(()=>20),borderColor:"#22c55e55",borderWidth:1,borderDash:[4,2],pointRadius:0},
    ]},
    options:{...baseOpts,scales:{...baseOpts.scales,y:{...baseOpts.scales.y,min:0,max:100}}}
  });
}

// ── BACKTEST SECTION IN MODAL ────────────────────────────────────────────────
function buildBtHtml(ticker, bt, isShort = false) {
  if(!btReady)
    return `<div style="color:var(--muted);padding:8px 0;font-size:12px">Analisi storica in corso... (pronto tra qualche minuto)</div>`;
  if(!bt || bt.signals === 0)
    return `<div style="color:var(--muted);padding:8px 0;font-size:12px">Nessun segnale ${isShort ? 'SHORT' : 'Alta Confidenza'} nei 3 anni analizzati.</div>`;

  const wc = relColor(bt.win_rate);
  const tc = bt.total_return >= 0 ? "var(--green)" : "var(--red)";
  const ac = bt.avg_return   >= 0 ? "var(--green)" : "var(--red)";
  const dc = bt.max_drawdown <= -10 ? "var(--red)" : bt.max_drawdown <= -5 ? "var(--yellow)" : "var(--green)";
  const plus = v => (v >= 0 ? "+" : "") + v + "%";

  return `
    <div class="bt-stats">
      ${btCard("Segnali generati", bt.signals,             "var(--text)")}
      ${btCard("Vittorie",         bt.win_rate + "%",      wc)}
      ${btCard("Rend. medio",      plus(bt.avg_return),    ac)}
      ${btCard("Rend. totale",     plus(bt.total_return),  tc)}
      ${btCard("Max Drawdown",     bt.max_drawdown + "%",  dc)}
      ${btCard("Migliore trade",   "+" + bt.best_trade + "%",  "var(--green)")}
      ${btCard("Peggiore trade",   bt.worst_trade + "%",       "var(--red)")}
    </div>
    <div class="chart-box" style="padding:12px;margin-bottom:8px">
      <div style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px">
        Equity curve — &euro;1000 investiti ad ogni segnale
      </div>
      <canvas id="${isShort ? 'cEquityShort' : 'cEquity'}" style="max-height:140px"></canvas>
    </div>
    <div class="bt-trade-wrap">
      <table class="bt-trade-table">
        <thead><tr>
          <th>Data segnale</th><th>Entrata</th><th>Uscita (+5 giorni)</th><th>Rendimento</th>
        </tr></thead>
        <tbody>
          ${bt.trades.map(t=>`
            <tr>
              <td>${t.date}</td>
              <td>${t.entry}</td>
              <td>${t.exit}</td>
              <td style="color:${t.ret>=0?"var(--green)":"var(--red)"};font-weight:700">
                ${t.ret>=0?"+":""}${t.ret}%
              </td>
            </tr>`).join("")}
        </tbody>
      </table>
    </div>`;
}

function btCard(label, value, color) {
  return `<div class="ind-card">
    <div class="lbl">${label}</div>
    <div class="val" style="color:${color};font-size:15px">${value}</div>
  </div>`;
}

function buildEquityCurve(curve, canvasId = "cEquity") {
  if(!curve || curve.length < 2) return;
  const ctx = document.getElementById(canvasId);
  if(!ctx) return;
  const gc = "#1e2030", tc = "#64748b";
  const startVal = 1000;
  const vals  = curve.map(p => +(p.value * startVal).toFixed(2));
  const color = vals[vals.length-1] >= startVal ? "#22c55e" : "#ef4444";
  cjInstances.equity = new Chart(ctx, {
    type: "line",
    data: {
      labels: curve.map(p => p.time),
      datasets: [{
        label: "Portfolio",
        data:  vals,
        borderColor: color,
        backgroundColor: color + "15",
        fill: true,
        borderWidth: 2,
        pointRadius: curve.length <= 20 ? 3 : 0,
        tension: 0.1,
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: true,
      plugins: {legend:{display:false}},
      scales: {
        x: {ticks:{color:tc, maxTicksLimit:8, font:{size:9}}, grid:{color:gc}},
        y: {ticks:{color:tc, font:{size:9}, callback:v=>"€"+v.toLocaleString("it-IT")}, grid:{color:gc}}
      }
    }
  });
}

function closeModal(){
  document.getElementById("modalOverlay").classList.remove("open");
}
</script>
</body>
</html>
